<text x="353" y="172">Exactly one CURRENT team group</text><text x="353" y="201">No client-controlled backend selection</text>
<text x="788" y="172">250 ms cache · fail closed</text><text x="788" y="201">JWT / asserted groups ignored</text>
<text x="48" y="360">Private socket → loopback :50052</text><text x="48" y="390">Sail A · only catalog token A</text>
<text x="48" y="420">Users in A share permissions/state</text><text x="48" y="449">No published backend port</text>
<text x="418" y="360">Private socket → loopback :50052</text><text x="418" y="390">Sail B · only catalog token B</text>
<text x="418" y="420">Users in B share permissions/state</text><text x="418" y="449">No published backend port</text>
<text x="788" y="360">Separate grants for identities A / B</text><text x="788" y="390">Verified TLS catalog requests</text>
<text x="788" y="420">PostgreSQL · verify-full</text><text x="788" y="449">Durable append-only admission audit</text>
