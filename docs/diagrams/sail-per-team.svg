<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Sail gateway: one instance and catalog identity per team</title>
<desc id="desc">TLS JWT gateway resolves exactly one team using serve's current Rauthy groups with a 250 millisecond cache. The gateway commits durable admission audit before connecting to a private team socket. Each socket bridges to a separate Sail loopback listener. Team A and B have separate catalog tokens and Lakekeeper grants. Users within a team share permissions. Direct storage access cannot enforce row and column rules.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
