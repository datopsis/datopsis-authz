<text x="48" y="559" font-size="17" fill="#fbbf24">Catalog isolation requires scoped storage access too</text>
<text x="48" y="587" font-size="14">Row/column-restricted tables: no direct storage credentials; use only an enforcing engine.</text>
<text x="48" y="613" font-size="14">Sail plans can use direct paths. Broad storage keys bypass catalog grants. Phase D remains separate.</text>
<text x="48" y="638" font-size="13" fill="#94a3b8">S3 blocking oracle: 1,000,000 exact rows / hashes / sum · no retries · PING ACK under downstream backpressure</text>
