<text x="30" y="40" font-size="25">Sail · one engine and catalog identity per team</text>
<text x="30" y="70" font-size="14">Owner decision 2026-11-26 · one platform binary · per-user / per-session identity deferred</text>
<g fill="#1e293b" stroke="#475569" stroke-width="2">
