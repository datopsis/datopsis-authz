<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Datopsis authorization: one platform binary with roles and a Lakekeeper adapter</title>
<desc id="desc">Lakekeeper verifies Rauthy tokens and their groups claim. A compiled adapter calls the serve role over verified HTTPS. The platform image also has planned Sail gateway, token broker, and policy roles. Trino uses the stock OPA plugin over HTTPS with trusted name-to-UUID bindings and row/mask templates. PostgreSQL is planned; S1/S2 use memory.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#546880"/></marker></defs>
