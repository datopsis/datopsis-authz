<g font-family="sans-serif" fill="#14243b">
<text x="35" y="42" font-size="25" font-weight="bold">Datopsis authorization — S1 + S2 spikes</text>
<text x="35" y="70" font-size="16">Working name · one monorepo · planned roles shown; dashed boxes are outside S1/S2</text>
<rect x="40" y="105" width="230" height="80" rx="10" fill="#e3eefe" stroke="#476d9f"/>
<text x="60" y="136" font-size="19">Rauthy</text><text x="60" y="162" font-size="15">OIDC / JWKS / groups</text>
<rect x="40" y="240" width="270" height="145" rx="10" fill="#e3eefe" stroke="#476d9f"/>
<text x="60" y="272" font-size="19">Lakekeeper thin binary</text><text x="60" y="300" font-size="15">pinned unmodified source</text>
<rect x="60" y="320" width="230" height="45" rx="6" fill="#fff" stroke="#476d9f"/><text x="75" y="347" font-size="16">lakekeeper-authz adapter</text>
<rect x="390" y="110" width="655" height="360" rx="12" fill="#e7f4ee" stroke="#2a7958" stroke-width="2"/>
<text x="410" y="145" font-size="21" font-weight="bold">One datopsis-authz program / image</text>
<rect x="415" y="170" width="600" height="105" rx="6" fill="#fff" stroke="#2a7958"/>
<text x="430" y="198" font-size="19">serve — Cedar decisions + relationship store + audit</text>
<text x="430" y="224" font-size="15">S1/S2: HTTPS, Cedar grants, memory, Trino OPA + SQL obligations</text>
<text x="430" y="250" font-size="15">Planned: PostgreSQL, durable audit; engine-only row/mask protection</text>
<g stroke="#779a89" stroke-dasharray="7 4" fill="#fff"><rect x="415" y="300" width="280" height="65" rx="6"/><rect x="720" y="300" width="295" height="65" rx="6"/></g>
<text x="430" y="328" font-size="18">sail-gateway (S3)</text><text x="430" y="350" font-size="14">JWT + Spark Connect enforcement</text>
<text x="735" y="328" font-size="18">token-broker (later)</text><text x="735" y="350" font-size="14">outbound token lifecycle</text>
<rect x="415" y="390" width="600" height="55" rx="6" fill="#fff" stroke="#2a7958"/><text x="430" y="423" font-size="17">policy — S1 schema check; validate/test/analyze planned</text>
<rect x="740" y="525" width="305" height="90" rx="8" fill="#e3eefe" stroke="#476d9f"/><text x="755" y="550" font-size="18">Trino 484 + stock OPA (S2)</text><text x="755" y="575" font-size="14">owner base + pinned plugin layer</text><text x="755" y="598" font-size="14">list / select / row filters / masks</text><path d="M1045 570H1075V225H1020" fill="none" stroke="#546880" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="535" width="260" height="65" rx="8" fill="#fff" stroke="#779a89" stroke-dasharray="7 4"/><text x="440" y="562" font-size="18">PostgreSQL (MVP)</text><text x="440" y="585" font-size="14">ownership, hierarchy, grants</text>
