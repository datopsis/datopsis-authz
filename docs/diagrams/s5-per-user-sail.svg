<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
<title id="title">S5: gateway selects a private Sail instance for each verified user</title>
<desc id="desc">The sail-gateway role validates JWTs and Cedar admission, then a trusted host supervisor starts or reuses a container by verified subject. Each user has a separate Sail process, network namespace, token directory, temp files and resource limits. Both use Lakekeeper over TLS with distinct user JWTs. Shared storage credentials remain an enforcement gap.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#536881"/></marker></defs>
<rect width="1100" height="610" fill="#f5f7fb"/>
<g font-family="sans-serif" fill="#14243b">
<text x="30" y="40" font-size="25" font-weight="bold">S5 · one Sail per verified user</text>
<text x="30" y="68" font-size="15">Native S5 controls pass on both CPUs · full platform acceptance remains red</text>
<g fill="#e3eefe" stroke="#476d9f"><rect x="30" y="115" width="180" height="75" rx="8"/><rect x="30" y="255" width="180" height="75" rx="8"/></g>
<text x="50" y="145" font-size="19">User A / User B</text><text x="50" y="170" font-size="14">same session ID allowed</text>
<text x="50" y="285" font-size="19">Rauthy + Cedar</text><text x="50" y="309" font-size="14">JWT / admission per RPC</text>
<rect x="270" y="105" width="300" height="260" rx="10" fill="#e7f4ee" stroke="#2a7958" stroke-width="2"/>
<text x="290" y="140" font-size="20">sail-gateway role</text><text x="290" y="170" font-size="15">verified subject → instance</text><text x="290" y="198" font-size="15">stream lease prevents idle reap</text>
<rect x="290" y="220" width="260" height="125" rx="6" fill="#fff" stroke="#2a7958"/><text x="305" y="249" font-size="18">Trusted host supervisor</text><text x="305" y="275" font-size="14">start / reuse / atomic JWT refresh</text><text x="305" y="299" font-size="14">idle stop / crash replacement</text><text x="305" y="323" font-size="14">private stdin; Docker administrator</text>
<g fill="#fff" stroke="#476d9f" stroke-width="2"><rect x="650" y="105" width="410" height="140" rx="9"/><rect x="650" y="280" width="410" height="140" rx="9"/></g>
<text x="670" y="136" font-size="19">A: private Sail container / process</text><text x="670" y="163" font-size="15">own loopback :50052 · own JWT mode 0400</text><text x="670" y="190" font-size="15">private tmpfs · read-only root · no Docker socket</text><text x="670" y="217" font-size="15">512 MiB / 1 CPU / 128 PIDs</text>
<text x="670" y="311" font-size="19">B: private Sail container / process</text><text x="670" y="338" font-size="15">own loopback :50052 · own JWT mode 0400</text><text x="670" y="365" font-size="15">private tmpfs · read-only root · no Docker socket</text><text x="670" y="392" font-size="15">512 MiB / 1 CPU / 128 PIDs</text>
<rect x="650" y="475" width="410" height="70" rx="9" fill="#e3eefe" stroke="#476d9f"/><text x="670" y="504" font-size="19">Lakekeeper + compiled Cedar adapter</text><text x="670" y="529" font-size="14">verified HTTPS · each user's catalog grants</text>
<g fill="none" stroke="#536881" stroke-width="2" marker-end="url(#arrow)"><path d="M210 150H265"/><path d="M270 292H215"/><path d="M570 175H645"/><path d="M570 305H645"/><path d="M1060 175H1080V510H1065"/><path d="M840 420V470"/></g>
<text x="580" y="158" font-size="12">exec pipe</text><text x="580" y="288" font-size="12">exec pipe</text>
<text x="30" y="485" font-size="17" font-weight="bold">Measured lifecycle ≠ complete data enforcement</text><text x="30" y="515" font-size="15">Shared static S3 keys still permit direct-path bypass.</text><text x="30" y="543" font-size="15">Production needs scoped storage credentials and admission limits.</text>
<text x="30" y="584" font-size="14">Controller/root is trusted. Container isolation does not protect against a compromised host or kernel.</text>
</g></svg>
