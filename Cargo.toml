[workspace]
resolver = "2"
members = ["crates/*"]
[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lakekeeper = { git = "https://github.com/lakekeeper/lakekeeper", rev = "9bd377162345b64a716f0a4fcffe4e7e7f3c7534" }
lakekeeper-storage-postgres = { git = "https://github.com/lakekeeper/lakekeeper", rev = "9bd377162345b64a716f0a4fcffe4e7e7f3c7534" }
[profile.dev]
debug = 0
incremental = false
[profile.release]
debug = 0
strip = true
