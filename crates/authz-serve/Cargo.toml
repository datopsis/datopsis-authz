[package]
name = "authz-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
authz-core = { path = "../authz-core" }
axum-server = { version = "=0.9.2", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest.workspace = true
# Use the same pinned driver/core directly; the multi-database facade's metadata
# includes optional SQLite even when its selected compilation graph excludes it.
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["json"] }
h2 = "=0.4.20"
bytes = "=1.12.1"
http = "=1.5.0"
jsonwebtoken = { version = "=10.4.0", features = ["aws_lc_rs"] }
tokio-rustls = "=0.26.6"
